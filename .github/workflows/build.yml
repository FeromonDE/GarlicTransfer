name: Build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle Windows Python
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile build/python-embed.zip
          Expand-Archive -Path build/python-embed.zip -DestinationPath build/windows-python -Force
          python -m pip download --only-binary=:all: --python-version 312 --platform win_amd64 'cryptography==44.0.3' --dest build/wheels
          if ($LASTEXITCODE -ne 0) { throw 'Python wheel download failed' }
          Get-ChildItem build/wheels/*.whl | ForEach-Object {
            [System.IO.Compression.ZipFile]::ExtractToDirectory($_.FullName, (Resolve-Path build/windows-python).Path, $true)
          }
          Add-Content -Path build/windows-python/python312._pth -Value '..'
          Copy-Item -Recurse poc build/poc
          & build/windows-python/python.exe -c "import cffi, cryptography; from cryptography.hazmat.primitives import cmac; print(cryptography.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python cryptography check failed' }
          & build/windows-python/python.exe -c "import poc.dt_discovery; print('discovery import ok')"
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python discovery check failed' }
      - run: npm ci
      - run: npm run check
      - run: node --test tests/console_locator_flow.test.cjs tests/transfer_cleanup.test.cjs
      - run: npx electron-builder --win nsis --x64 --publish never
      - name: Install and test packaged app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem dist/*.exe -File)
          if ($installers.Count -ne 1) { throw "Expected one EXE, found $($installers.Count)" }
          $installer = $installers[0].FullName
          Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$env:TEMP\smoke-install") -Wait
          $python = "$env:TEMP\smoke-install\resources\python\python.exe"
          $deadline = [DateTime]::UtcNow.AddSeconds(30)
          while (-not (Test-Path -LiteralPath $python -PathType Leaf)) {
              if ([DateTime]::UtcNow -gt $deadline) { throw "Bundled Python not found at $python" }
              Start-Sleep -Milliseconds 250
          }
          $env:PYTHONPATH = "$env:TEMP\smoke-install\resources"
          & $python -c "import cffi; from cryptography.hazmat.primitives import cmac; print('CFFI and CMAC OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Installed cryptography check failed' }
          & $python -c "import poc.dt_discovery, poc.dt_pair, poc.dt_backend; print('Backend imports OK')"
          if ($LASTEXITCODE -ne 0) { throw 'Installed backend check failed' }
          $helper = "$env:TEMP\smoke-install\Garlic-Firewall-Helper.bat"
          if (-not (Test-Path -LiteralPath $helper -PathType Leaf)) { throw 'Firewall helper missing beside GarlicTransfer.exe' }
          & $helper /help
          if ($LASTEXITCODE -ne 0) { throw "Firewall helper /help failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: GarlicTransfer-Windows-x64
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: ${{ github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts
      - run: ls -lh artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.exe
          generate_release_notes: true
